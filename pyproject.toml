[project]
name = "candles"
version = "0.1.0"
description = "15-minute candlestick pattern study"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "requests>=2.31",
    "scipy>=1.13",
    "tzdata>=2024.1",  # Windows has no built-in timezone database
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0"]

[project.scripts]
candles = "candles.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
